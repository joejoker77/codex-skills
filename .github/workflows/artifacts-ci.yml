name: artifacts

# Event-triggered only. There is deliberately no `schedule:` here and there must never be one.
# One step does call a model — the judge — and that is exactly why: a scheduled judgement is a
# scheduled bill, and this fleet has already paid one. $360 in a night, re-reading content
# nobody had changed. On an event, against a diff, the same judge costs a few cents.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the sensitive-paths gate needs the base to diff against

      - name: Fetch the scanner from the platform
        run: |
          # The scanner lives with the platform that enforces it, so this repository cannot
          # weaken its own examiner by editing a copy.
          curl -fsSL -o ci/scan.py \
            https://raw.githubusercontent.com/joejoker77/codex-fleet-platform/main/runtime/artifacts/scan.py
          test -s ci/scan.py

      - name: Artifacts
        run: python3 ci/scan.py skills && { [ ! -d mcp ] || python3 ci/scan.py mcp; }

      - name: Sensitive paths
        if: github.event_name == 'pull_request'
        run: |
          ci/gate-sensitive-paths.sh "origin/${{ github.base_ref }}" \
            "${{ join(github.event.pull_request.labels.*.name, ' ') }}"

      - name: Rate limit
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ci/gate-rate-limit.sh "${{ github.event.pull_request.user.login }}" \
            "${{ join(github.event.pull_request.labels.*.name, ' ') }}"

      # The semantic half. Patterns cannot read, so this one does — on the files this pull
      # request changed and on nothing else. There is no `schedule:` in this file and there must
      # never be one: a judge on a clock re-scored unchanged content on this fleet for a night
      # and cost $360. Every cap it runs under is in ci/gate-llm-judge.py, and the spend ceiling
      # that matters is on the key itself, at the provider.
      - name: Judge
        if: github.event_name == 'pull_request'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python3 ci/gate-llm-judge.py "origin/${{ github.base_ref }}"
